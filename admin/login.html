<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Вход администратора</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#020617;color:#e5e7eb;font-family:system-ui,sans-serif;padding:24px}
    .card{width:min(420px,100%);background:#0f172a;border:1px solid #334155;border-radius:18px;padding:24px;box-shadow:0 24px 60px #0008}
    h1{font-size:22px;margin:0 0 8px}.muted{color:#94a3b8;font-size:13px;margin-bottom:18px}
    label{font-size:13px;color:#cbd5e1;display:block;margin-bottom:6px}input{width:100%;padding:12px;border-radius:10px;border:1px solid #475569;background:#020617;color:#fff;font-size:16px}
    button{width:100%;margin-top:14px;padding:12px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer}.error{color:#fecaca;font-size:13px;min-height:20px;margin-top:10px}
  </style>
</head>
<body>
  <form class="card" id="loginForm">
    <h1>Админ · ручные поезда</h1>
    <div class="muted">Раздел доступен только администратору.</div>
    <label for="password">Пароль администратора</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
    <button type="submit">Войти</button>
    <div class="error" id="error"></div>
  </form>
<script>
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const error = document.getElementById('error');
    error.textContent = '';
    const res = await fetch('/api/admin/login', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ password: document.getElementById('password').value })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      error.textContent = data.error || 'Не удалось войти';
      return;
    }
    location.href = '/admin/trains';
  });
</script>
</body>
</html>
